<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Namaz Vakitleri | Ayetin Vakti</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            color: var(--accent-color);
        }

        .city-select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            font-size: 1rem;
            outline: none;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .vakit-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vakit-card {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .vakit-isim {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .vakit-saat {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Namaz Vakitleri</h1>
        <p id="tarih-bilgi" style="color: var(--text-muted); font-size: 0.9rem;">Yükleniyor...</p>
    </div>

    <!-- 81 İl Listesi -->
    <select id="sehir-secimi" class="city-select" onchange="vakitleriGetir()">
        <option value="Adana">Adana</option>
        <option value="Adiyaman">Adıyaman</option>
        <option value="Afyonkarahisar">Afyonkarahisar</option>
        <option value="Agri">Ağrı</option>
        <option value="Aksaray">Aksaray</option>
        <option value="Amasya">Amasya</option>
        <option value="Ankara">Ankara</option>
        <option value="Antalya">Antalya</option>
        <option value="Ardahan">Ardahan</option>
        <option value="Artvin">Artvin</option>
        <option value="Aydin">Aydın</option>
        <option value="Balikesir">Balıkesir</option>
        <option value="Bartin">Bartın</option>
        <option value="Batman">Batman</option>
        <option value="Bayburt">Bayburt</option>
        <option value="Bilecik">Bilecik</option>
        <option value="Bingol">Bingöl</option>
        <option value="Bitlis">Bitlis</option>
        <option value="Bolu">Bolu</option>
        <option value="Burdur">Burdur</option>
        <option value="Bursa">Bursa</option>
        <option value="Canakkale">Çanakkale</option>
        <option value="Cankiri">Çankırı</option>
        <option value="Corum">Çorum</option>
        <option value="Denizli">Denizli</option>
        <option value="Diyarbakir">Diyarbakır</option>
        <option value="Duzce">Düzce</option>
        <option value="Edirne">Edirne</option>
        <option value="Elazig">Elazığ</option>
        <option value="Erzincan">Erzincan</option>
        <option value="Erzurum">Erzurum</option>
        <option value="Eskisehir">Eskişehir</option>
        <option value="Gaziantep">Gaziantep</option>
        <option value="Giresun">Giresun</option>
        <option value="Gumushane">Gümüşhane</option>
        <option value="Hakkari">Hakkari</option>
        <option value="Hatay">Hatay</option>
        <option value="Igdir">Iğdır</option>
        <option value="Isparta">Isparta</option>
        <option value="Istanbul" selected>İstanbul</option>
        <option value="Izmir">İzmir</option>
        <option value="Kahramanmaras">Kahramanmaraş</option>
        <option value="Karabuk">Karabük</option>
        <option value="Karaman">Karaman</option>
        <option value="Kars">Kars</option>
        <option value="Kastamonu">Kastamonu</option>
        <option value="Kayseri">Kayseri</option>
        <option value="Kilis">Kilis</option>
        <option value="Kirikkale">Kırıkkale</option>
        <option value="Kirklareli">Kırklareli</option>
        <option value="Kirsehir">Kırşehir</option>
        <option value="Kocaeli">Kocaeli</option>
        <option value="Konya">Konya</option>
        <option value="Kutahya">Kütahya</option>
        <option value="Malatya">Malatya</option>
        <option value="Manisa">Manisa</option>
        <option value="Mardin">Mardin</option>
        <option value="Mersin">Mersin</option>

        <option value="Trabzon">Trabzon</option>
        <option value="Tunceli">Tunceli</option>
        <option value="Usak">Uşak</option>
        <option value="Van">Van</option>
        <option value="Yalova">Yalova</option>
        <option value="Yozgat">Yozgat</option>
        <option value="Zonguldak">Zonguldak</option>
    </select>

    <!-- Vakit Listesi -->
    <div class="vakit-cards">
        <div class="vakit-card">
            <span class="vakit-isim">İmsak</span>
            <span class="vakit-saat" id="Fajr">--:--</span>
        </div>
        <div class="vakit-card">
            <span class="vakit-isim">Güneş</span>
            <span class="vakit-saat" id="Sunrise">--:--</span>
        </div>
        <div class="vakit-card">
            <span class="vakit-isim">Öğle</span>
            <span class="vakit-saat" id="Dhuhr">--:--</span>
        </div>
        <div class="vakit-card">
            <span class="vakit-isim">İkindi</span>
            <span class="vakit-saat" id="Asr">--:--</span>
        </div>
        <div class="vakit-card">
            <span class="vakit-isim">Akşam</span>
            <span class="vakit-saat" id="Maghrib">--:--</span>
        </div>
        <div class="vakit-card">
            <span class="vakit-isim">Yatsı</span>
            <span class="vakit-saat" id="Isha">--:--</span>
        </div>
    </div>

    <div class="footer">
        <p>Ayetin Vakti • Diyanet Uyumlu Veriler</p>
    </div>
</div>

<script>
    async function vakitleriGetir() {
        const sehir = document.getElementById('sehir-secimi').value;
        const url = `https://api.aladhan.com/v1/timingsByCity?city=${sehir}&country=Turkey&method=13`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const timings = data.data.timings;

            // Tarihi Türkçe formata çevirme
            const bugun = new Date();
            const turkceTarih = bugun.toLocaleDateString('tr-TR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                weekday: 'long'
            });

            document.getElementById('tarih-bilgi').innerText = turkceTarih;

            // Saatleri Güncelle
            document.getElementById('Fajr').innerText = timings.Fajr;
            document.getElementById('Sunrise').innerText = timings.Sunrise;
            document.getElementById('Dhuhr').innerText = timings.Dhuhr;
            document.getElementById('Asr').innerText = timings.Asr;
            document.getElementById('Maghrib').innerText = timings.Maghrib;
            document.getElementById('Isha').innerText = timings.Isha;

        } catch (error) {
            console.error("Vakitler alınırken hata oluştu:", error);
            document.getElementById('tarih-bilgi').innerText = "Veri alınamadı";
        }
    }

    // Sayfa açıldığında çalıştır
    vakitleriGetir();
</script>

</body>
</html>

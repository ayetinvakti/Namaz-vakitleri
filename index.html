<!DOCTYPE html>
<html lang="tr">
<head>
    <script>
    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('light-mode');
        });
    }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Namaz Vakitleri | Ayetin Vakti</title>
    <!-- Sosyal Medya & Mesajlaşma Önizleme Etiketleri -->
    <meta property="og:title" content="Namaz Vakitleri | Ayetin Vakti">
    <meta property="og:description" content="Canlı namaz vakitleri, kalan süre sayacı ve hassas konum desteği.">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            color: var(--accent-color);
        }

        /* Geri Sayım Kartı */
        .countdown-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .countdown-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-prayer-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            font-family: monospace;
            color: var(--text-color);
        }

        .city-select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            font-size: 1rem;
            outline: none;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .vakit-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vakit-card {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        /* Aktif Vakit Vurgusu */
        .vakit-card.active {
            border-color: var(--accent-color);
            background-color: #112a2e;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .vakit-isim {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .vakit-saat {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        /* Açık Tema (Light Mode) Stilleri */
body.light-mode {
    background-color: #f8fafc !important;
    color: #1a202c !important;
}

body.light-mode .card, 
body.light-mode .container,
body.light-mode .vakit-card,
body.light-mode .header {
    background: #ffffff !important;
    color: #1a202c !important;
    border-color: #e2e8f0 !important;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
}

body.light-mode h1, 
body.light-mode h2, 
body.light-mode h3,
body.light-mode p,
body.light-mode .vakit-title,
body.light-mode .vakit-time {
    color: #2d3748 !important;
}
    </style>
</head>
<body>

<script>
    let timerInterval = null;

    async function vakitleriGetir() {
        const sehir = document.getElementById('sehir-secimi').value;
        const url = `https://api.aladhan.com/v1/timingsByCity?city=${sehir}&country=Turkey&method=13`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const timings = data.data.timings;

            // Tarihi Türkçe formata çevirme
            const bugun = new Date();
            const turkceTarih = bugun.toLocaleDateString('tr-TR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                weekday: 'long'
            });

            document.getElementById('tarih-bilgi').innerText = turkceTarih;

            // Saatleri Güncelle
            document.getElementById('Fajr').innerText = timings.Fajr;
            document.getElementById('Sunrise').innerText = timings.Sunrise;
            document.getElementById('Dhuhr').innerText = timings.Dhuhr;
            document.getElementById('Asr').innerText = timings.Asr;
            document.getElementById('Maghrib').innerText = timings.Maghrib;
            document.getElementById('Isha').innerText = timings.Isha;

            // Sayacı Başlat
            sayaciBaslat(timings);

        } catch (error) {
            console.error("Vakitler alınırken hata oluştu:", error);
            document.getElementById('tarih-bilgi').innerText = "Veri alınamadı";
        }
    }

    function sayaciBaslat(timings) {
        if (timerInterval) clearInterval(timerInterval);

        const vakitListesi = [
            { id: 'Fajr', name: 'İmsak', time: timings.Fajr },
            { id: 'Sunrise', name: 'Güneş', time: timings.Sunrise },
            { id: 'Dhuhr', name: 'Öğle', time: timings.Dhuhr },
            { id: 'Asr', name: 'İkindi', time: timings.Asr },
            { id: 'Maghrib', name: 'Akşam', time: timings.Maghrib },
            { id: 'Isha', name: 'Yatsı', time: timings.Isha }
        ];

        function guncelle() {
            const simdi = new Date();
            let sonrakiVakit = null;

            // Kart vurgularını temizle
            document.querySelectorAll('.vakit-card').forEach(card => card.classList.remove('active'));

            for (let vakit of vakitListesi) {
                const [saat, dakika] = vakit.time.split(':');
                const vakitTarihi = new Date();
                vakitTarihi.setHours(parseInt(saat), parseInt(dakika), 0, 0);

                if (vakitTarihi > simdi) {
                    sonrakiVakit = { ...vakit, targetDate: vakitTarihi };
                    break;
                }
            }

            // Eğer tüm vakitler geçtiyse (Yatsıdan sonra ise yarının İmsak vakti)
            if (!sonrakiVakit) {
                const [saat, dakika] = timings.Fajr.split(':');
                const yarinkiImsak = new Date();
                yarinkiImsak.setDate(yarinkiImsak.getDate() + 1);
                yarinkiImsak.setHours(parseInt(saat), parseInt(dakika), 0, 0);

                sonrakiVakit = { id: 'Fajr', name: 'İmsak (Yarın)', targetDate: yarinkiImsak };
            }

            // Aktif olan kartı vurgula
            const activeCard = document.getElementById(`card-${sonrakiVakit.id}`);
            if (activeCard) activeCard.classList.add('active');

            // Kalan süreyi hesapla
            const fark = sonrakiVakit.targetDate - simdi;

            const saatler = Math.floor(fark / (1000 * 60 * 60));
            const dakikalar = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
            const saniyeler = Math.floor((fark % (1000 * 60)) / 1000);

            const format = (num) => String(num).padStart(2, '0');

            document.getElementById('next-prayer-title').innerText = sonrakiVakit.name;
            document.getElementById('countdown-timer').innerText = 
                `${format(saatler)}:${format(dakikalar)}:${format(saniyeler)}`;
        }

        guncelle();
        timerInterval = setInterval(guncelle, 1000);
    }

    // Sayfa açıldığında çalıştır
    vakitleriGetir();
</script>
